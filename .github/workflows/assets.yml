name: Refresh reference assets
on:
  push:
    branches: [feat/career-expansion]
    paths: [scripts/sync-reference-assets.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-reference-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: reference-assets
          path: target/reference-assets/
          retention-days: 3
